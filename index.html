<!DOCTYPE html>
<html>
<body>
  <canvas id="world" width="400" height="300"></canvas>

  <script>
    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d");

    const size = 100;

    ctx.fillStyle = "green";
    ctx.fillRect(50, 50, size, size);
  </script>
</body>
</html>
